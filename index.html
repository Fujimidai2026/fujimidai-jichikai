<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>つくば市富士見台自治会</title>

<style>
body {
    font-family: "Yu Gothic", sans-serif;
    margin: 0;
    background: #ffffff;
    color: #333;
    font-size: 18px;
}

/* メニュー */
nav {
    background: #ffffff;
    border-bottom: 2px solid #c9a066;
}

nav ul {
    list-style: none;
    margin: 0;
    padding: 10px;
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
}

nav li {
    margin: 5px 15px;
}

nav a {
    text-decoration: none;
    color: #333;
    font-weight: bold;
    font-size: 18px;
}

/* 大きな写真 */
.header-img img {
    width: 100%;
    height: 250px;
    object-fit: cover;
    display: block;
}

/* セクション */
section {
    padding: 20px;
    max-width: 900px;
    margin: auto;
}

h2 {
    border-left: 10px solid #c9a066;
    padding-left: 10px;
    margin-top: 40px;
}

/* ボタン */
.big-button {
    display: block;
    background: #b3e5ff;
    color: #333;
    padding: 20px;
    margin: 20px 0;
    text-align: center;
    font-size: 22px;
    border-radius: 10px;
    text-decoration: none;
    border: 2px solid #c9a066;
}

/* PDFカード */
.pdf-card {
    display: flex;
    align-items: center;
    background: #fff;
    border: 1px solid #ccc;
    padding: 10px;
    margin: 15px 0;
    border-radius: 8px;
}

.pdf-thumb {
    width: 120px;
    height: auto;
    border: 1px solid #aaa;
    margin-right: 15px;
}

.pdf-info h3 {
    margin: 0 0 5px 0;
    font-size: 1.1em;
}

.pdf-info a {
    color: #0066cc;
    text-decoration: none;
}

.pdf-info a:hover {
    text-decoration: underline;
}

/* フッター */
footer {
    background: #c9a066;
    color: white;
    text-align: center;
    padding: 15px;
    margin-top: 40px;
}
</style>
</head>

<!-- ヘッダー写真 -->
